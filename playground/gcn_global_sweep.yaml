program: pretrain_GCN_network.py
method: bayes
metric:
  name: val_loss
  goal: minimize
parameters:
  lr:
    distribution: uniform
    min: 0.0001
    max: 0.01
  batch_size:
    values: [256, 512, 1024]
  hidden_size:
    values: [64, 90, 128]
  num_gcn_layers:
    values: [2, 3, 4]
command:
  - ${env}
  - python
  - ${program}
  - --sweep
  - --name
  - GCN_global_hp_sweep
  - --pool-type
  - global
  - --num-epochs
  - 1000